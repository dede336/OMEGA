name: Build Android APK

on:
  push:
    branches: [source]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Tipo de build"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Instalar dependências
        run: pnpm install

      - name: Gerar arquivos nativos Android (prebuild)
        working-directory: artifacts/omega-dx10
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_DOMAIN: ${{ secrets.EXPO_PUBLIC_DOMAIN }}
        run: npx expo prebuild --platform android --no-install

      - name: Configurar keystore (release)
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: artifacts/omega-dx10/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          cat >> gradle.properties << EOF
          MYAPP_UPLOAD_STORE_FILE=release.keystore
          MYAPP_UPLOAD_KEY_ALIAS=$KEY_ALIAS
          MYAPP_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD
          MYAPP_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD
          EOF

      - name: Build APK Debug
        if: ${{ github.event.inputs.build_type != 'release' }}
        working-directory: artifacts/omega-dx10/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build APK Release
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: artifacts/omega-dx10/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK Debug
        if: ${{ github.event.inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: OMEGA-DX10-debug
          path: artifacts/omega-dx10/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload APK Release
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: OMEGA-DX10-release
          path: artifacts/omega-dx10/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
